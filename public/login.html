<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VMIIT Admin Login</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e3a8a,
                    #2563eb
                );

            padding: 20px;
        }


        .login-container {
            width: 100%;
            max-width: 420px;

            background: #ffffff;

            border-radius: 18px;

            padding: 40px 35px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.25);
        }


        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background: #2563eb;

            color: #ffffff;

            font-size: 24px;
            font-weight: bold;
        }


        h1 {
            text-align: center;

            color: #111827;

            font-size: 28px;

            margin-bottom: 8px;
        }


        .subtitle {
            text-align: center;

            color: #6b7280;

            font-size: 14px;

            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 20px;
        }


        label {
            display: block;

            color: #374151;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;
        }


        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }


        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }


        .login-button {
            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 14px;

            background: #2563eb;

            color: #ffffff;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        .login-button:hover {
            background: #1d4ed8;
        }


        .login-button:disabled {
            background: #93c5fd;

            cursor: not-allowed;
        }


        .message {
            display: none;

            margin-bottom: 20px;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;

            text-align: center;
        }


        .message.error {
            display: block;

            color: #991b1b;

            background: #fee2e2;

            border: 1px solid #fecaca;
        }


        .message.success {
            display: block;

            color: #166534;

            background: #dcfce7;

            border: 1px solid #bbf7d0;
        }


        .back-link {
            display: block;

            text-align: center;

            margin-top: 22px;

            color: #2563eb;

            text-decoration: none;

            font-size: 14px;
        }


        .back-link:hover {
            text-decoration: underline;
        }


        .footer {
            text-align: center;

            margin-top: 25px;

            color: #9ca3af;

            font-size: 12px;
        }


        @media (max-width: 480px) {

            .login-container {
                padding: 30px 22px;
            }

            h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="logo">
            VI
        </div>


        <h1>
            Admin Login
        </h1>


        <p class="subtitle">
            Sign in to manage VMIIT courses
        </p>


        <div
            id="message"
            class="message"
        ></div>


        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="loginButton"
                class="login-button"
            >
                Login
            </button>


        </form>


        <a
            href="/"
            class="back-link"
        >
            ← Back to Home
        </a>


        <div class="footer">
            © 2026 VMIIT. All rights reserved.
        </div>


    </div>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");


        function showMessage(
            text,
            type
        ) {

            message.textContent = text;

            message.className =
                "message " + type;

        }


        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                if (!email || !password) {

                    showMessage(
                        "Email and password are required",
                        "error"
                    );

                    return;
                }


                loginButton.disabled = true;

                loginButton.textContent =
                    "Logging in...";


                message.className =
                    "message";


                try {

                    const response =
                        await fetch(
                            "/api/auth/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email,
                                    password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        showMessage(
                            data.message ||
                            "Login failed",
                            "error"
                        );

                        return;
                    }


                    localStorage.setItem(
                        "token",
                        data.token
                    );


                    localStorage.setItem(
                        "admin",
                        JSON.stringify(
                            data.admin
                        )
                    );


                    showMessage(
                        "Login successful. Redirecting...",
                        "success"
                    );


                    setTimeout(
                        () => {

                            window.location.href =
                                "/admin";

                        },
                        800
                    );


                } catch (error) {

                    console.error(
                        "Login Error:",
                        error
                    );


                    showMessage(
                        "Unable to connect to server",
                        "error"
                    );


                } finally {

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Login";

                }

            }
        );

    </script>


</body>

</html>
